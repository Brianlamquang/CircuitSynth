[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "circuitsynth-data-pipeline"
version = "0.1.0"
description = "Constraint-aware synthetic data generation with probabilistic semantic priors"
requires-python = ">=3.10"
dependencies = [
  "numpy==2.1.3",
  "PyYAML==6.0.2",
  "scipy==1.14.1",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]
full = [
  "torch>=2.5,<3",
  "datasets==3.2.0",
  "huggingface-hub==0.27.1",
  "transformers==4.48.1",
  "accelerate==1.3.0",
  "peft==0.14.0",
  "bitsandbytes==0.45.1",
  "psutil==6.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
